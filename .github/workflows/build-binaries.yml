name: build-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { os: ubuntu-latest, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          # macOS (macos-26-intel = Intel, macos-14 = Apple Silicon)
          - { os: macos-26-intel, target: macos-amd64 }
          - { os: macos-14, target: macos-arm64 }
          # Windows
          - { os: windows-latest, target: windows-amd64 }
          - { os: windows-11-arm, target: windows-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build standalone binary
        shell: bash
        run: |
          uv sync --frozen --no-default-groups
          uv run --with pyinstaller pyinstaller --clean --noconfirm --distpath dist packaging/edcb-bridge.spec
      - name: Smoke-test the binary
        shell: bash
        run: |
          binary="dist/edcb-bridge"
          [ -f "$binary" ] || binary="dist/edcb-bridge.exe"
          "$binary" --version
          "$binary" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edcb-bridge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # PyInstaller cannot cross-compile, so the release is assembled here once every
  # native runner has uploaded its binary. Immutable releases lock the assets of a
  # published release, so it is created as a draft and published afterwards.
  release:
    name: publish release with binaries
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            target="$(basename "$dir")"
            if [ -f "${dir}edcb-bridge.exe" ]; then
              cp "${dir}edcb-bridge.exe" "release/${target}.exe"
            elif [ -f "${dir}edcb-bridge" ]; then
              cp "${dir}edcb-bridge" "release/${target}"
              chmod +x "release/${target}"
            fi
          done
          ls -l release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: release/*
          fail_on_unmatched_files: true
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
